[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-provider-opensysml"
version = "0.1.0"
description = "Apache Airflow provider for OpenSysML: SysML v2 models as assets, analysis and verification cases as tasks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "OpenMBEE" }]
keywords = ["airflow", "provider", "sysml", "sysml v2", "mbse", "opensysml"]
classifiers = [
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "apache-airflow>=3.0.0",
    "opensysml>=0.9.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/Open-MBEE/airflow-provider-opensysml"
OpenSysML = "https://github.com/Open-MBEE/OpenSysML"

[project.entry-points.apache_airflow_provider]
provider_info = "airflow_provider_opensysml:get_provider_info"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: needs a sysml-grpc service (started privately by the opensysml client)"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "example_dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
