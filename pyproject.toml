[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-provider-opensysml"
version = "0.1.0"
description = "Apache Airflow provider for OpenSysML: SysML v2 models as assets, analysis and verification cases as tasks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "OpenMBEE" }]
keywords = ["airflow", "provider", "sysml", "sysml v2", "mbse", "opensysml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "apache-airflow>=3.3.2",
    "opensysml>=0.12.1",
]

[project.optional-dependencies]
kubernetes = ["apache-airflow-providers-cncf-kubernetes>=10.17.0"]
dev = [
    "build>=1.2",
    "twine>=5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "apache-airflow-providers-cncf-kubernetes>=10.17.0",
]

[project.urls]
Homepage = "https://github.com/Open-MBEE/airflow-provider-opensysml"
Source = "https://github.com/Open-MBEE/airflow-provider-opensysml"
Issues = "https://github.com/Open-MBEE/airflow-provider-opensysml/issues"
OpenSysML = "https://github.com/Open-MBEE/OpenSysML"
Changelog = "https://github.com/Open-MBEE/airflow-provider-opensysml/blob/develop/CHANGELOG.md"

[project.entry-points.apache_airflow_provider]
provider_info = "airflow_provider_opensysml:get_provider_info"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airflow_provider_opensysml = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: needs a sysml-grpc service (started privately by the opensysml client)"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "example_dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
