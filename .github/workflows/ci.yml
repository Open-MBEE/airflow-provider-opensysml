name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.python-version }}, opensysml ${{ matrix.opensysml }})
    runs-on: ubuntu-latest
    # The develop job is an early warning that OpenSysML's next release moves
    # something the provider or its examples rely on; it does not block a change here.
    continue-on-error: ${{ matrix.opensysml == 'develop' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        opensysml: [release]
        include:
          - python-version: "3.12"
            opensysml: develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The released client downloads the sysml-grpc it pins; the sysml CLI the
      # model checks use comes from the same release.
      - name: Install the released sysml CLI
        if: matrix.opensysml == 'release'
        run: |
          version="$(python -c 'import opensysml; print(opensysml.__version__)')"
          mkdir -p "$RUNNER_TEMP/sysml"
          curl -fsSL "https://github.com/Open-MBEE/OpenSysML/releases/download/v${version}/sysml-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/sysml"
          mv "$RUNNER_TEMP/sysml/sysml-linux-amd64" "$RUNNER_TEMP/sysml/sysml"
          echo "$RUNNER_TEMP/sysml" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        if: matrix.opensysml == 'develop'
        with:
          go-version: "1.25"
      - name: Build OpenSysML develop
        if: matrix.opensysml == 'develop'
        run: |
          git clone --depth 1 --branch develop https://github.com/Open-MBEE/OpenSysML.git "$RUNNER_TEMP/OpenSysML"
          cd "$RUNNER_TEMP/OpenSysML"
          go build -o bin/sysml ./cmd/sysml
          go build -o bin/sysml-grpc ./cmd/sysml-grpc
          pip install -e client/python
          echo "OPENSYSML_BINARY=$RUNNER_TEMP/OpenSysML/bin/sysml-grpc" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/OpenSysML/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Model checks
        run: |
          sysml -version
          sysml example_dags/terrain_ncam/terrain_ncam.sysml
          sysml -satisfy example_dags/terrain_ncam/terrain_ncam.sysml
          sysml example_dags/terrain_ncam/terrain_ncam.sysml -analysis 'TerrainNCAM::Verification::stereoPairCheck(leftAcquisition = "a", rightAcquisition = "a", leftEye = "L", rightEye = "R")'
          sysml example_dags/terrain_ncam/terrain_ncam.sysml -graphs TerrainNCAM::Pipeline::Terrain -o "$RUNNER_TEMP/graphs.json"
          python -c "import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); assert a['subject']==b['subject'] and len(a['actions'])==len(b['actions'])" "$RUNNER_TEMP/graphs.json" example_dags/terrain_ncam/terrain_ncam.graphs.json
          sysml example_dags/terrain_ncam/terrain_ncam.sysml -render-document TerrainNCAM::Report::TerrainReport -doc-form html -o "$RUNNER_TEMP/terrain.html"
      - name: Unit tests
        run: pytest -m "not integration"
      - name: Integration tests
        run: pytest -m integration
      - name: Build the distribution
        if: matrix.opensysml == 'release'
        run: |
          python -m build
          twine check dist/*
